# ----------------------------------------------------
# 3. LỆNH REST ĐIỀU KHIỂN ROBOT VALETUDO
# ----------------------------------------------------
rest_command:
  valetudo_basic_control:
    url: "http://192.168.1.173/api/v2/robot/capabilities/BasicControlCapability"
    method: "PUT"
    content_type: "application/json"
    payload: '{"action": "{{ action }}"}'

  valetudo_locate:
    url: "http://192.168.1.173/api/v2/robot/capabilities/LocateCapability"
    method: "PUT"
    content_type: "application/json"
    payload: '{"action": "locate"}'

  valetudo_clean_segment:
    url: "http://192.168.1.173/api/v2/robot/capabilities/MapSegmentationCapability"
    method: "PUT"
    content_type: "application/json"
    payload: '{"action": "start_segment_action", "segment_ids": {{ segment_ids }}, "iterations": {{ iterations | default(1) }}}'

  valetudo_empty_dock:
    url: "http://192.168.1.173/api/v2/robot/capabilities/AutoEmptyDockManualTriggerCapability"
    method: "PUT"
    content_type: "application/json"
    payload: '{"action": "trigger"}'

  valetudo_clean_mop:
    url: "http://192.168.1.173/api/v2/robot/capabilities/MopDockCleanManualTriggerCapability"
    method: "PUT"
    content_type: "application/json"
    payload: '{"action": "start"}'

  valetudo_dry_mop:
    url: "http://192.168.1.173/api/v2/robot/capabilities/MopDockDryManualTriggerCapability"
    method: "PUT"
    content_type: "application/json"
    payload: '{"action": "start"}'

# ----------------------------------------------------
# 4. TEMPLATE SENSOR & TEMPLATE VACUUM CHUẨN MODERN HA
# ----------------------------------------------------
template:

  - select:
      - name: "Robot Mova Chế Độ Làm Việc"
        unique_id: robot_mova_che_do_lam_viec
        icon: mdi:cog-sync
        state: >
          {% set m = states('select.valetudo_l40_ultra_oilyinstructivebeaver_mode') %}
          {% if m == 'vacuum_and_mop' %} Hút bụi & Lau nhà
          {% elif m == 'vacuum' %} Chỉ hút bụi
          {% elif m == 'mop' %} Chỉ lau nhà
          {% elif m == 'vacuum_then_mop' %} Hút trước, Lau sau
          {% else %} Hút bụi & Lau nhà {% endif %}
        options: "{{ ['Hút bụi & Lau nhà', 'Chỉ hút bụi', 'Chỉ lau nhà', 'Hút trước, Lau sau'] }}"
        select_option:
          action: select.select_option
          target:
            entity_id: select.valetudo_l40_ultra_oilyinstructivebeaver_mode
          data:
            option: >
              {% if option == 'Hút bụi & Lau nhà' %} vacuum_and_mop
              {% elif option == 'Chỉ hút bụi' %} vacuum
              {% elif option == 'Chỉ lau nhà' %} mop
              {% elif option == 'Hút trước, Lau sau' %} vacuum_then_mop
              {% else %} vacuum_and_mop {% endif %}

      - name: "Robot Mova Lực Hút Bụi"
        unique_id: robot_mova_luc_hut_bui
        icon: mdi:fan
        state: >
          {% set f = states('select.valetudo_l40_ultra_oilyinstructivebeaver_fan') %}
          {% if f == 'low' %} Yên tĩnh (Nhẹ)
          {% elif f == 'medium' %} Tiêu chuẩn (Vừa)
          {% elif f == 'high' %} Mạnh
          {% elif f == 'max' %} Siêu mạnh (Tối đa)
          {% else %} Tiêu chuẩn (Vừa) {% endif %}
        options: "{{ ['Yên tĩnh (Nhẹ)', 'Tiêu chuẩn (Vừa)', 'Mạnh', 'Siêu mạnh (Tối đa)'] }}"
        select_option:
          action: select.select_option
          target:
            entity_id: select.valetudo_l40_ultra_oilyinstructivebeaver_fan
          data:
            option: >
              {% if option == 'Yên tĩnh (Nhẹ)' %} low
              {% elif option == 'Tiêu chuẩn (Vừa)' %} medium
              {% elif option == 'Mạnh' %} high
              {% elif option == 'Siêu mạnh (Tối đa)' %} max
              {% else %} medium {% endif %}

      - name: "Robot Mova Lượng Nước Lau"
        unique_id: robot_mova_luong_nuoc_lau
        icon: mdi:water-percent
        state: >
          {% set w = states('select.valetudo_l40_ultra_oilyinstructivebeaver_water') %}
          {% if w == 'min' %} Rất ít (Khô ráo)
          {% elif w == 'low' %} Ít (Lau nhẹ)
          {% elif w == 'medium' %} Vừa (Tiêu chuẩn)
          {% elif w == 'high' %} Nhiều (Ướt đẫm)
          {% elif w == 'max' %} Tối đa (Làm sạch sâu)
          {% else %} Vừa (Tiêu chuẩn) {% endif %}
        options: "{{ ['Rất ít (Khô ráo)', 'Ít (Lau nhẹ)', 'Vừa (Tiêu chuẩn)', 'Nhiều (Ướt đẫm)', 'Tối đa (Làm sạch sâu)'] }}"
        select_option:
          action: select.select_option
          target:
            entity_id: select.valetudo_l40_ultra_oilyinstructivebeaver_water
          data:
            option: >
              {% if option == 'Rất ít (Khô ráo)' %} min
              {% elif option == 'Ít (Lau nhẹ)' %} low
              {% elif option == 'Vừa (Tiêu chuẩn)' %} medium
              {% elif option == 'Nhiều (Ướt đẫm)' %} high
              {% elif option == 'Tối đa (Làm sạch sâu)' %} max
              {% else %} medium {% endif %}
  - sensor:
      - name: "Trạng Thái Biến Tần Lumentree"
        unique_id: lumentree_inverter_status
        icon: >
          {% if is_state('input_boolean.solar_health_fault_status', 'on') %}
            mdi:lightning-bolt-alert
          {% elif is_state('input_boolean.solar_health_monitor_enabled', 'off') %}
            mdi:shield-off
          {% else %}
            mdi:solar-power-variant
          {% endif %}
        state: >
          {% set start = states('input_datetime.solar_health_start_time') %}
          {% set end = states('input_datetime.solar_health_end_time') %}
          {% set now_time = now().strftime('%H:%M:%S') %}
          
          {% if is_state('input_boolean.solar_health_monitor_enabled', 'off') %}
            Đã Tắt Giám Sát
          {% elif is_state('input_boolean.solar_health_fault_status', 'on') %}
            ⚠️ LỖI: PIN MẶT TRỜI 0W
          {% elif now_time >= start and now_time <= end %}
            🟢 Đang Giám Sát (Bình Thường)
          {% else %}
            🌙 Ngoài Khung Giờ Giám Sát
          {% endif %}

      - name: "Trạng Thái Máy Lạnh Solar"
        unique_id: trang_thai_may_lanh_solar
        icon: mdi:snowflake
        state: >
          {% set st = states('input_select.solar_ac_auto_current_state') %}
          {% if is_state('input_boolean.solar_ac_auto_control_enabled', 'off') %}
            Đã Tắt Tự Động Máy Lạnh
          {% elif st == 'THIẾU ĐIỆN SOLAR (TẮT MÁY LẠNH)' %}
            ⚠️ Thiếu Điện Solar (Đã Tắt Máy Lạnh)
          {% elif st == 'ĐỦ ĐIỆN SOLAR (MỞ MÁY LẠNH)' %}
            ✅ Đủ Điện Solar (Đã Mở Máy Lạnh)
          {% else %}
            🟢 Đang Giám Sát (Bình Thường)
          {% endif %}

      - name: "Robot Mova Trạng Thái Tiếng Việt"
        unique_id: robot_mova_trang_thai_tieng_viet
        icon: mdi:robot-vacuum
        state: >
          {% set st = states('sensor.valetudo_l40_ultra_oilyinstructivebeaver_dock_status') %}
          {% set err = states('sensor.valetudo_l40_ultra_oilyinstructivebeaver_error') %}
          {% if err != 'none' and err != 'ok' and err != 'unavailable' and err != 'unknown' %}
            ⚠️ Cảnh báo lỗi: {{ err }}
          {% elif st == 'docked' or st == 'charging' or st == 'idle' %}
            🏠 Đang ở Trạm Sạc Dock (Sẵn Sàng)
          {% elif st == 'drying' %}
            💨 Đang sấy khô giẻ lau
          {% elif st == 'washing' %}
            🧼 Đang tự động giặt giẻ lau
          {% elif st == 'emptying' %}
            🗑️ Đang hút rác lên Dock
          {% elif st == 'cleaning' %}
            🟢 Đang hút bụi & lau nhà
          {% elif st == 'returning' %}
            🏃 Đang quay về Dock sạc
          {% elif st == 'paused' %}
            ⏸️ Đang tạm dừng
          {% else %}
            🟢 Sẵn sàng làm việc
          {% endif %}

  - vacuum:
      - name: "Valetudo L40 Ultra (OilyInstructiveBeaver)"
        unique_id: valetudo_l40_ultra_oilyinstructivebeaver
        state: >
          {% set st = states('sensor.valetudo_l40_ultra_oilyinstructivebeaver_dock_status') %}
          {% if st == 'docked' or st == 'charging' or st == 'idle' %}
            docked
          {% elif st == 'cleaning' %}
            cleaning
          {% elif st == 'paused' %}
            paused
          {% elif st == 'returning' %}
            returning
          {% else %}
            docked
          {% endif %}
        battery_level: "{{ states('sensor.valetudo_l40_ultra_oilyinstructivebeaver_battery_level') | int(0) }}"
        start:
          action: rest_command.valetudo_basic_control
          data:
            action: "start"
        pause:
          action: rest_command.valetudo_basic_control
          data:
            action: "pause"
        stop:
          action: rest_command.valetudo_basic_control
          data:
            action: "stop"
        return_to_base:
          action: rest_command.valetudo_basic_control
          data:
            action: "home"
        locate:
          action: rest_command.valetudo_locate

# ----------------------------------------------------
# 5. CẢM BIẾN NHẬN DIỆN KHUÔN MẶT (FRIGATE & MQTT)
# ----------------------------------------------------
mqtt:
  camera:
    - name: "Camera Dahua Truoc Cua"
      unique_id: camera_dahua_truoc_cua
      topic: "frigate/dahua_cam"
  sensor:
    - name: "Face Recognition Person"
      unique_id: face_recognition_person
      state_topic: "homeassistant/face/match"
      icon: mdi:account-check

    - name: "Face Recognition Last Time"
      unique_id: face_recognition_last_time
      state_topic: "homeassistant/face/match_time"
      icon: mdi:clock-check-outline

# ----------------------------------------------------
# 6. INPUT HELPERS (NÚT BẤM VÀ DANH SÁCH CHỌN HỒ SƠ)
# ----------------------------------------------------
input_select:
  face_profile_train:
    name: "Chọn hồ sơ khuôn mặt"
    options:
      - "Huy"
      - "Dien"
      - "Me"
      - "Khang"
    icon: mdi:account-group

input_button:
  test_face_recognition:
    name: "Test nhận diện khuôn mặt"
    icon: mdi:face-recognition

  capture_face_preview:
    name: "1. Bấm Chụp Ảnh (Xem trước)"
    icon: mdi:camera

  confirm_save_face:
    name: "2. ✅ Đồng Ý Lưu Vào Hồ Sơ"
    icon: mdi:check-circle

  retake_face:
    name: "🔄 Chụp Lại"
    icon: mdi:camera-retake

input_text:
  face_test_result:
    name: "Kết quả kiểm tra"
    initial: "Sẵn sàng"
    max: 255
  preview_image_url:
    name: "URL Ảnh Xem Trước"
    initial: "/local/preview_face.jpg"
    max: 255


shell_command:
  start_solar_daemon: "sh /config/start_daemon.sh"
  preview_face: "/bin/sh /config/preview_face.sh"
  save_face: "/bin/sh /config/save_face.sh '{{ name }}'"
  test_face: "/bin/sh /config/test_face.sh"
  delete_face: "/bin/sh /config/delete_face.sh '{{ person }}' '{{ filename }}'"


