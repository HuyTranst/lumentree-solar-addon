    min: 1
    max: 60
    step: 1
    unit_of_measurement: "phút"
    icon: mdi:timer-cog
  solar_ac_pv_low_voltage:
    name: "Ngưỡng áp PV1 thấp (V)"
    min: 100
    max: 500
    step: 1
    unit_of_measurement: "V"
