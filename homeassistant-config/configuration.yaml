    has_time: true
  solar_health_end_time:
    name: "Giờ kết thúc kiểm tra"
    has_date: false
    has_time: true
  solar_ac_auto_start_time:
    name: "Giờ bắt đầu kiểm tra máy lạnh"
    has_date: false
    has_time: true
  solar_ac_auto_end_time:
    name: "Giờ kết thúc kiểm tra máy lạnh"
    has_date: false
