# ==============================================================================
# PHẦN 2: KỊCH BẢN NÚT NHẤN HỒNG NGOẠI TẮT / MỞ MÁY LẠNH (ĐỂ TRỐNG ĐỂ THÊM THIẾT BỊ SẠU)
# ==============================================================================
# ==============================================================================
# PHẦN 2: KỊCH BẢN NÚT NHẤN HỒNG NGOẠI TẮT / MỞ MÁY LẠNH (GỬI THÔNG BÁO VỀ ĐT)
# ==============================================================================
# ==============================================================================
# KỊCH BẢN NÚT NHẤN HỒNG NGOẠI TẮT / MỞ MÁY LẠNH (GỬI THÔNG BÁO THỬ NGHIỆM ĐT)
# ==============================================================================
lumentree_turn_off_ac_ir:
  alias: "❄️ [Hồng Ngoại] Lệnh TẮT Máy Lạnh"
  description: "Lệnh gửi qua nút nhấn hồng ngoại TẮT máy lạnh (Có thông báo ĐT)"
  sequence:
    - service: notify.notify
      data:
        title: "❄️ [Hồng Ngoại] Lệnh TẮT Máy Lạnh"
        message: "Đã kích hoạt lệnh TẮT máy lạnh qua nút bấm Hồng Ngoại lúc {{ now().strftime('%H:%M:%S') }}."
        data:
          push:
            sound:
              name: default
          priority: high
    - service: persistent_notification.create
      data:
        title: "❄️ [Hồng Ngoại] Lệnh TẮT Máy Lạnh"
        message: "Đã kích hoạt lệnh TẮT máy lạnh qua Hồng Ngoại lúc {{ now().strftime('%H:%M:%S') }}."
        notification_id: "ac_ir_off_log"
  mode: single
  icon: mdi:power-plug-off

lumentree_turn_on_ac_ir:
  alias: "❄️ [Hồng Ngoại] Lệnh MỞ Máy Lạnh"
  description: "Lệnh gửi qua nút nhấn hồng ngoại MỞ máy lạnh (Có thông báo ĐT)"
  sequence:
    - service: notify.notify
      data:
        title: "❄️ [Hồng Ngoại] Lệnh MỞ Máy Lạnh"
        message: "Đã kích hoạt lệnh MỞ máy lạnh qua nút bấm Hồng Ngoại lúc {{ now().strftime('%H:%M:%S') }}."
        data:
          push:
            sound:
              name: default
          priority: high
    - service: persistent_notification.create
      data:
        title: "❄️ [Hồng Ngoại] Lệnh MỞ Máy Lạnh"
        message: "Đã kích hoạt lệnh MỞ máy lạnh qua Hồng Ngoại lúc {{ now().strftime('%H:%M:%S') }}."
        notification_id: "ac_ir_on_log"
  mode: single
  icon: mdi:power-plug
